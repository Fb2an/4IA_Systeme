name: C build and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LL
        run: cmake -S 01_LinkedList -B build-ll && cmake --build build-ll
      - name: Build DLL
        run: cmake -S 02_DoubleLinkedList -B build-dll && cmake --build build-dll
      - name: Run function tests and benchmarks
        run: ./build-ll/Systeme_01 && ./build-dll/02_DoubleLinkedList
